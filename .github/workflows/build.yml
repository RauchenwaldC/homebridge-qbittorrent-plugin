name: Build and Lint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The versions declared in package.json engines.node, which are the LTS releases
        # Homebridge itself supports.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type-check the tests
        run: npm run typecheck:test

      - name: Check the published file set
        run: npm pack --dry-run

  # engines.homebridge claims ^1.8.0 as well as ^2.0.0, so check the source really does
  # only use APIs that exist in Homebridge 1.8.
  homebridge-1-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Type-check against Homebridge 1.8
        run: |
          npm install --no-save homebridge@1.8.5
          npx tsc --noEmit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
