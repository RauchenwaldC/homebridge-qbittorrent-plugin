name: Publish to npm

# Publishing a GitHub release publishes the same version to npm. This mirrors how the
# Homebridge project itself releases (homebridge/homebridge release.yml): npm's OIDC
# trusted publishing, so no npm token is stored in the repository. `--provenance` attaches
# a verifiable link from the npm package back to this workflow run.
#
# ONE-TIME SETUP on npmjs.com (Package -> Settings -> Trusted Publisher):
#   GitHub Actions / RauchenwaldC/homebridge-qbittorrent-plugin / publish.yml
# Without that, this workflow fails at the publish step with an authentication error.

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a newer npm than ships with Node 22.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Refuse a release tag that does not match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `prepublishOnly` runs lint, the tests and the build again as part of publish.
      - name: Publish
        run: npm publish --provenance --access public
